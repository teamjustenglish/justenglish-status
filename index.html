<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JustEnglish Status</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 16 16%22><circle cx=%228%22 cy=%228%22 r=%228%22 fill=%22%2344c785%22/></svg>">
<style>
  :root {
    --green: #44c785;
    --red: #f2545b;
    --orange: #e88a3a;
    --yellow: #e5c34d;
    --blue: #4c9ee8;
    --bg: #0d1117;
    --panel: #161b22;
    --text: #e6edf3;
    --muted: #8b949e;
    --border: #30363d;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    padding: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
  }
  a { color: inherit; }
  .header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    max-width: 760px;
    margin: 0 auto;
    padding: 24px 20px 12px;
  }
  .header .brand {
    font-weight: 700;
    font-size: 18px;
    letter-spacing: -0.2px;
  }
  .header nav a {
    font-size: 14px;
    text-decoration: none;
    color: var(--muted);
    margin-left: 16px;
  }
  .header nav a:hover { color: var(--text); }

  .banner {
    background: var(--green);
    color: #05130c;
    text-align: center;
    padding: 28px 20px;
    transition: background 0.3s ease;
  }
  .banner.status-red { background: var(--red); color: #2a0505; }
  .banner.status-orange { background: var(--orange); color: #2a1600; }
  .banner.status-yellow { background: var(--yellow); color: #2a2200; }
  .banner h1 {
    margin: 0;
    font-size: 22px;
    font-weight: 600;
  }
  .banner .stamp {
    margin-top: 6px;
    font-size: 13px;
    opacity: 0.85;
  }

  .container {
    max-width: 760px;
    margin: 0 auto;
    padding: 28px 20px 60px;
  }

  .incidents {
    border: 1px solid var(--red);
    background: rgba(242, 84, 91, 0.08);
    border-radius: 8px;
    padding: 4px 0;
    margin-bottom: 24px;
  }
  .incidents .incidents-title {
    font-size: 12px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    color: var(--red);
    padding: 10px 16px 4px;
  }
  .incident-item {
    display: flex;
    justify-content: space-between;
    gap: 12px;
    padding: 8px 16px;
    font-size: 14px;
    text-decoration: none;
    color: var(--text);
  }
  .incident-item:hover { background: rgba(242, 84, 91, 0.12); }
  .incident-item .incident-time {
    color: var(--muted);
    font-size: 12px;
    white-space: nowrap;
  }

  .section-caption {
    color: var(--muted);
    font-size: 13px;
    margin-bottom: 14px;
  }
  .section-caption a { color: var(--muted); text-decoration: underline; }

  .components {
    border: 1px solid var(--border);
    border-radius: 8px;
    overflow: hidden;
    background: var(--panel);
  }
  .component {
    padding: 16px 18px;
    border-bottom: 1px solid var(--border);
  }
  .component:last-child { border-bottom: none; }
  .component-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
  }
  .component-name {
    font-size: 15px;
    font-weight: 500;
    text-decoration: none;
    color: var(--text);
  }
  .component-name:hover { text-decoration: underline; }
  .component-status {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 13px;
    font-weight: 600;
    white-space: nowrap;
  }
  .status-dot {
    width: 9px;
    height: 9px;
    border-radius: 50%;
    flex: none;
  }
  .status-up .status-dot, .status-up.component-status { color: var(--green); }
  .status-up .status-dot { background: var(--green); }
  .status-down .status-dot, .status-down.component-status { color: var(--red); }
  .status-down .status-dot { background: var(--red); }
  .status-degraded .status-dot, .status-degraded.component-status { color: var(--yellow); }
  .status-degraded .status-dot { background: var(--yellow); }
  .status-unknown .status-dot, .status-unknown.component-status { color: var(--muted); }
  .status-unknown .status-dot { background: var(--border); }

  .incident-link {
    font-size: 12px;
    color: var(--red);
    text-decoration: underline;
    margin-left: 8px;
  }

  .bars {
    display: flex;
    gap: 2px;
    margin-top: 12px;
    height: 34px;
    align-items: flex-end;
  }
  .bar {
    flex: 1 1 0;
    min-width: 2px;
    max-width: 8px;
    height: 100%;
    border-radius: 2px;
    background: var(--border);
    cursor: default;
    position: relative;
  }
  .bar.up { background: var(--green); }
  .bar.partial { background: var(--yellow); }
  .bar.down { background: var(--red); }
  .bar:hover::after {
    content: attr(data-tip);
    position: absolute;
    bottom: 120%;
    left: 50%;
    transform: translateX(-50%);
    background: #000;
    border: 1px solid var(--border);
    color: #fff;
    font-size: 11px;
    padding: 4px 8px;
    border-radius: 4px;
    white-space: nowrap;
    z-index: 5;
    pointer-events: none;
  }
  .meta-row {
    display: flex;
    justify-content: space-between;
    margin-top: 8px;
    font-size: 12px;
    color: var(--muted);
  }

  .footer {
    max-width: 760px;
    margin: 0 auto;
    padding: 20px 20px 40px;
    color: var(--muted);
    font-size: 13px;
    text-align: center;
  }
  .footer a { text-decoration: underline; }

  .loading {
    text-align: center;
    color: var(--muted);
    padding: 40px 0;
    font-size: 14px;
  }

  @media (max-width: 480px) {
    .component-name { font-size: 14px; }
  }
</style>
</head>
<body>

  <div class="header">
    <div class="brand">JustEnglish Status</div>
    <nav>
      <a href="https://github.com/teamjustenglish/justenglish-status">GitHub</a>
    </nav>
  </div>

  <div class="banner" id="banner">
    <h1 id="banner-text">Loading status&hellip;</h1>
    <div class="stamp" id="banner-stamp"></div>
  </div>

  <div class="container">
    <div class="incidents" id="incidents" hidden>
      <div class="incidents-title">Active Incidents</div>
      <div id="incidents-list"></div>
    </div>

    <div class="section-caption">Uptime since monitoring began.</div>
    <div class="components" id="components">
      <div class="loading">Fetching live data&hellip;</div>
    </div>
  </div>

  <div class="footer">
    <a href="https://github.com/teamjustenglish/justenglish-status">Source</a> &middot;
    Checked every 5 minutes
  </div>

<script>
(function () {
  var REPO = "teamjustenglish/justenglish-status";
  var DATA_URL = "https://raw.githubusercontent.com/" + REPO + "/master/history/summary.json";
  var ISSUES_URL = "https://api.github.com/repos/" + REPO + "/issues?state=open&labels=status&per_page=20";
  // Monitoring for this status page began on this date; don't render bars before it.
  var TRACKING_START = new Date(2026, 8, 15);
  TRACKING_START.setHours(0, 0, 0, 0);
  var MAX_DAYS = 90;

  function fmtDate(d) {
    var y = d.getFullYear();
    var m = String(d.getMonth() + 1).padStart(2, "0");
    var day = String(d.getDate()).padStart(2, "0");
    return y + "-" + m + "-" + day;
  }

  function niceDate(d) {
    return d.toLocaleDateString(undefined, { month: "short", day: "numeric", year: "numeric" });
  }

  function slugify(name) {
    return name
      .toLowerCase()
      .replace(/[^a-z0-9]+/g, "-")
      .replace(/(^-|-$)/g, "");
  }

  function buildBars(site) {
    var wrap = document.createElement("div");
    wrap.className = "bars";
    var daily = site.dailyMinutesDown || {};
    var today = new Date();
    today.setHours(0, 0, 0, 0);

    var daysTracked = Math.floor((today - TRACKING_START) / 86400000) + 1;
    var numDays = Math.max(1, Math.min(MAX_DAYS, daysTracked));

    for (var i = numDays - 1; i >= 0; i--) {
      var d = new Date(today);
      d.setDate(d.getDate() - i);
      var key = fmtDate(d);
      var bar = document.createElement("div");
      bar.className = "bar";

      var down = daily[key] || 0;
      if (down <= 0) {
        bar.classList.add("up");
        bar.setAttribute("data-tip", niceDate(d) + " — no downtime");
      } else if (down < 60) {
        bar.classList.add("partial");
        bar.setAttribute("data-tip", niceDate(d) + " — " + down + " min down");
      } else {
        bar.classList.add("down");
        bar.setAttribute("data-tip", niceDate(d) + " — " + down + " min down");
      }
      wrap.appendChild(bar);
    }
    return wrap;
  }

  function statusClass(status) {
    if (status === "up") return "status-up";
    if (status === "down") return "status-down";
    if (status === "degraded") return "status-degraded";
    return "status-unknown";
  }

  function statusLabel(status) {
    if (status === "up") return "Operational";
    if (status === "down") return "Down";
    if (status === "degraded") return "Degraded";
    return "Unknown";
  }

  function renderIncidents(issues) {
    var box = document.getElementById("incidents");
    var list = document.getElementById("incidents-list");
    list.innerHTML = "";
    if (!issues || issues.length === 0) {
      box.hidden = true;
      return;
    }
    box.hidden = false;
    issues.forEach(function (issue) {
      var a = document.createElement("a");
      a.className = "incident-item";
      a.href = issue.html_url;
      a.target = "_blank";
      a.rel = "noopener";

      var title = document.createElement("span");
      title.textContent = issue.title.replace(/^🛑\s*/, "");

      var time = document.createElement("span");
      time.className = "incident-time";
      time.textContent = "since " + new Date(issue.created_at).toLocaleString();

      a.appendChild(title);
      a.appendChild(time);
      list.appendChild(a);
    });
  }

  function render(sites, issues) {
    var container = document.getElementById("components");
    container.innerHTML = "";

    var anyDown = sites.some(function (s) { return s.status === "down"; });
    var anyDegraded = sites.some(function (s) { return s.status === "degraded"; });

    var banner = document.getElementById("banner");
    var bannerText = document.getElementById("banner-text");
    banner.classList.remove("status-red", "status-orange", "status-yellow");
    if (anyDown) {
      banner.classList.add("status-red");
      bannerText.textContent = "Some systems are experiencing issues";
    } else if (anyDegraded) {
      banner.classList.add("status-yellow");
      bannerText.textContent = "Some systems are degraded";
    } else {
      bannerText.textContent = "All systems are operational";
    }
    document.getElementById("banner-stamp").textContent =
      "Last checked " + new Date().toLocaleString();

    // Map site slug -> matching open incident issue, so a down component can link straight to it
    var issueBySlug = {};
    (issues || []).forEach(function (issue) {
      (issue.labels || []).forEach(function (label) {
        var name = typeof label === "string" ? label : label.name;
        if (name && name !== "status") issueBySlug[name] = issue;
      });
    });

    sites.forEach(function (site) {
      var row = document.createElement("div");
      row.className = "component";

      var top = document.createElement("div");
      top.className = "component-row";

      var name = document.createElement("a");
      name.className = "component-name";
      name.textContent = site.name;
      name.href = site.url;
      name.target = "_blank";
      name.rel = "noopener";

      var status = document.createElement("div");
      status.className = "component-status " + statusClass(site.status);
      var dot = document.createElement("span");
      dot.className = "status-dot";
      status.appendChild(dot);
      status.appendChild(document.createTextNode(statusLabel(site.status)));

      if (site.status === "down" || site.status === "degraded") {
        var issue = issueBySlug[site.slug];
        if (issue) {
          var link = document.createElement("a");
          link.className = "incident-link";
          link.href = issue.html_url;
          link.target = "_blank";
          link.rel = "noopener";
          link.textContent = "details";
          status.appendChild(link);
        }
      }

      top.appendChild(name);
      top.appendChild(status);
      row.appendChild(top);
      row.appendChild(buildBars(site));

      var meta = document.createElement("div");
      meta.className = "meta-row";
      meta.innerHTML =
        "<span>" + (site.uptimeYear || site.uptime || "100.00%") + " uptime</span>" +
        "<span>" + (site.time != null ? site.time + " ms" : "") + "</span>";
      row.appendChild(meta);

      container.appendChild(row);
    });
  }

  Promise.all([
    fetch(DATA_URL, { cache: "no-store" }).then(function (r) { return r.json(); }),
    fetch(ISSUES_URL, { cache: "no-store" }).then(function (r) { return r.ok ? r.json() : []; }).catch(function () { return []; }),
  ])
    .then(function (results) {
      var sites = results[0];
      var issues = results[1];
      renderIncidents(issues);
      render(sites, issues);
    })
    .catch(function () {
      document.getElementById("components").innerHTML =
        '<div class="loading">Could not load status data. <a href="https://github.com/teamjustenglish/justenglish-status">View on GitHub</a>.</div>';
    });
})();
</script>

</body>
</html>
