  # baseUrl: /your-repo-name
  logoUrl: https://raw.githubusercontent.com/upptime/upptime.js.org/master/static/img/icon.svg
  name: JustEnglish Status
  introTitle: "**JustEnglish Status** — real-time uptime monitoring for all JustEnglish services."
  introMessage: This status page uses **real-time** data from our [GitHub repository](https://github.com/teamjustenglish/justenglish-status). No server required — just GitHub Actions, Issues, and Pages.
  navbar:
    - title: Status
      href: /
    - title: GitHub
      href: https://github.com/$OWNER/$REPO

